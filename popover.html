</head><body><main class="panel"><span class="symbol-bg"><img src="./assets/scys/icon_topnav.png" alt=""></span><div class="content"><header class="head"><div><p class="title">今日 OpenToken</p><p id="serviceText" class="sub" role="status" aria-live="polite">正在读取本地快照...</p></div><section id="syncFacts" class="sync-lights" aria-label="同步状态灯"></section><span class="live"><span class="dot"></span>live</span></header><div class="actions"><button id="uploadButton" class="btn primary"><i data-lucide="upload-cloud"></i><span id="uploadLabel">立即上报</span></button><button id="pauseButton" class="btn" title="暂停面板自动刷新，不影响后台统计和上报"><i data-lucide="pause"></i><span id="pauseLabel">暂停刷新</span></button><button id="leaderboardButton" class="btn icon" aria-label="打开真实榜单" title="用默认浏览器打开生财有术 Token 消耗排行榜"><i data-lucide="external-link"></i></button><button id="logButton" class="btn icon" aria-label="打开日志" title="打开本地事件日志"><i data-lucide="file-text"></i></button></div><section class="hero" aria-label="今日榜单分与总榜名次"><div><p id="totalCaption" class="label">榜单分</p><p id="totalValue" class="value">--</p></div><div class="rank"><span id="rankCaption">总榜</span><strong id="rankValue">#--</strong></div></section><section id="usageTrend" class="trend-panel" aria-label="GLM 消耗趋势"></section><section class="domain-block" aria-label="本机工具实际 Token"><div class="domain-head"><strong>本机工具</strong><span id="localUsageState">等待本地统计</span></div><section id="toolList" class="tools"></section></section><section id="rankFacts" class="facts" aria-label="SCYS 榜单指标"></section><section id="identityBind" class="identity-bind" aria-label="榜单账号绑定" hidden><div class="identity-copy"><strong id="identityTitle">榜单账号未匹配</strong><span id="identityDetail">请选择一次公开榜单账号；绑定只保存在本机。</span></div><div class="identity-controls"><select id="identitySelect" aria-label="选择公开榜单账号" disabled><option value="">请先加载账号列表</option></select><button id="identityLoadButton" type="button">加载</button><button id="identityBindButton" class="primary" type="button" disabled>确认</button></div></section><section class="domain-block" aria-label="SCYS 榜单工具构成"><div class="domain-head"><strong>榜单工具构成</strong><span>同账号多电脑 · 榜单分 · <button id="identityManageButton" class="identity-manage" type="button">绑定账号</button></span></div><section id="leaderboardToolList" class="tools board-tools"></section></section><section id="quotaList" class="quotas" aria-label="模型额度"></section></div></main><script>
const API = '/api';
const $ = (selector) => document.querySelector(selector);
let refreshPaused = false;
let activeTrendPeriod = '24h';
let lastTrendPayload = null;
let loadController = null;
let loadSequence = 0;
let manualUploadRunning = false;
let syncPolling = false;
let lastHeroScore = '--';
let lastLocalUsage = '--';
let identityPanelOpen = false;
let identityAccount = '';
let lastIdentityPayload = null;
const trendSelection = {};
const TREND_PERIOD_KEYS = ['24h', '7d', '30d'];

function icons() {
  if (window.lucide) lucide.createIcons();
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function quotaList() {
  let list = document.querySelector("#quotaList");
  if (!list) {
    list = document.createElement('section');
    list.id = 'quotaList';
    list.className = 'quotas';
    const trend = $('#usageTrend');
    if (trend) trend.before(list);
  }
  return list;
}

function defaultQuotaFeed(key) {
  const defaults = {
    glm: {
      key: 'glm',
      label: 'GLM / Z.ai',
      valueLabel: '--',
      detail: '等待额度上报',
      status: 'waiting',
      items: [{
        label: '5小时额度',
        valueLabel: '--',
        detail: '等待智谱额度数据 · 等待重置时间',
        pct: 4
      }, {
        label: 'MCP额度',
        valueLabel: '--',
        detail: '等待智谱 MCP 数据 · 等待重置时间',
        pct: 4
      }]
    },
    cursor: {
      key: 'cursor',
      label: 'Cursor',
      valueLabel: '--',
      detail: '等待 Cursor 额度',
      status: 'waiting',
      items: [{
        label: 'Cursor 模型',
        usedLabel: '--',
        remainingLabel: '--',
        detail: '含 Grok / Composer · 等待重置时间',
        pct: 4
      }, {
        label: '其他模型',
        usedLabel: '--',
        remainingLabel: '--',
        detail: '至少 $400 API · 等待重置时间',
        pct: 4
      }]
    },
    grok: {
      key: 'grok',
      label: 'Grok',
      valueLabel: '--',
      detail: '等待 Grok 额度',
      status: 'waiting',
      items: [{
        label: '周期额度',
        remainingLabel: '--',
        detail: '等待 Grok 周期数据 · 等待重置时间',
        pct: 4
      }]
    },
    codex: {
      key: 'codex',
      label: 'Codex',
      valueLabel: '--',
      detail: '等待 Codex 额度',
      status: 'waiting',
      items: [{
        label: '周额度',
        remainingLabel: '--',
        detail: '等待 Codex 周期数据 · 等待重置时间',
        pct: 4
      }]
    },
    kimi: {
      key: 'kimi',
      label: 'Kimi',
      valueLabel: '--',
      detail: '等待 Kimi 编程套餐额度',
      status: 'waiting',
      items: [{
        label: '5小时额度',
        remainingLabel: '--',
        detail: '等待 Kimi 窗口数据 · 等待重置时间',
        pct: 4
      }, {
        label: '周额度',
        remainingLabel: '--',
        detail: '等待 Kimi 周期数据 · 等待重置时间',
        pct: 4
      }]
    }
  };
  return defaults[key];
}

function defaultQuotaFeeds() {
  return [defaultQuotaFeed('glm')];
}

function quotaItemDetail(item) {
  return item.resetLabel || item.detail || '--';
}

function quotaRemainingText(item) {
  if (item.remainingLabel) return item.remainingLabel;
  const pct = Number(item.pct);
  if (Number.isFinite(pct)) return '剩余 ' + Math.max(0, 100 - Math.round(pct)) + '%';
  return '--';
}

function quotaHeadlineText(item) {
  if (item.usedLabel) return item.usedLabel;
  return quotaRemainingText(item);
}

function renderQuotaItems(feed) {
  const items = Array.isArray(feed.items) && feed.items.length ? feed.items : [{
    label: feed.label,
    valueLabel: feed.valueLabel,
    detail: feed.detail,
    pct: feed.pct
  }];
  return items.slice(0, 3).map((item) =>
    '<div class="quota-item"><div class="quota-line"><span class="quota-name">' + esc(item.label) + '</span><span class="quota-remaining">' + esc(quotaHeadlineText(item)) + '</span></div><span class="quota-detail">' + esc(quotaItemDetail(item)) + '</span><span class="bar"><i style="width:' + Math.max(4, Math.min(100, Number(item.pct) || 0)) + '%"></i></span></div>'
  ).join('');
}

function renderQuotaCard(feed) {
  const plan = feed.levelLabel ? '<span class="quota-plan">' + esc(feed.levelLabel) + '</span>' : '';
  const statusLabels = { ok: '正常', partial: '部分可用', stale: '数据暂旧', expired: '数据已过期', waiting: '读取中', error: '读取失败' };
  const status = esc(statusLabels[feed.status] || feed.status || '读取中');
  return '<div class="quota quota-card-wide"><div class="quota-head"><strong>' + esc(feed.label) + '</strong><span class="quota-state">' + status + '</span></div><span class="quota-summary">' + esc(feed.detail || feed.valueLabel || '--') + plan + '</span><div class="quota-items">' + renderQuotaItems(feed) + '</div></div>';
}

function renderGlmQuotaCard(feed) {
  return renderQuotaCard(feed);
}

function renderQuotaFeeds(feeds) {
  const list = feeds && feeds.length ? feeds : [];
  const glm = list.find((feed) => feed && feed.key === 'glm') || list[0] || defaultQuotaFeed('glm');
  const cursor = list.find((feed) => feed && feed.key === 'cursor') || defaultQuotaFeed('cursor');
  const grok = list.find((feed) => feed && feed.key === 'grok') || defaultQuotaFeed('grok');
  const codex = list.find((feed) => feed && feed.key === 'codex') || defaultQuotaFeed('codex');
  const kimi = list.find((feed) => feed && feed.key === 'kimi') || defaultQuotaFeed('kimi');
  quotaList().innerHTML = [glm, cursor, grok, codex, kimi].map(renderQuotaCard).join('');
}

function renderSyncFacts(facts) {
  const labels = { local: '本机', upload: '上报', national: '总榜', city: '城市' };
  const statusLabel = { ok: '已就绪', waiting: '进行中', blocked: '受阻', 'outside-window': '未进窗' };
  const order = ['local', 'upload', 'national', 'city'];
  const source = facts || {};
  const node = $('#syncFacts');
  if (!node) return;
  node.innerHTML = order.map((key) => {
    const item = source[key] || { status: 'waiting', detail: '等待同步' };
    const status = item.status || 'waiting';
    const tip = labels[key] + ' · ' + (statusLabel[status] || status) + '：' + (item.detail || '等待同步');
    return '<button type="button" class="sync-light" data-status="' + esc(status) + '" data-tip="' + esc(tip) + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '"><i></i><span>' + esc(labels[key]) + '</span></button>';
  }).join('');
}

function renderRankFacts(facts) {
  const fallback = [
    { label: '实际 Token（本机）', valueLabel: '--', detail: '仅这台电脑，不含其他设备' },
    { label: '距上一名', valueLabel: '--', detail: '等待榜单数据' },
    { label: '城市榜', valueLabel: '#--', detail: 'SCYS 未返回城市身份' }
  ];
  const items = facts && Array.isArray(facts.items) && facts.items.length ? facts.items : fallback;
  $('#rankFacts').innerHTML = items.slice(0, 3).map((item) =>
    '<div class="fact" title="' + esc(item.detail || '') + '"><span>' + esc(item.label || '--') + '</span><strong>' + esc(item.valueLabel || '--') + '</strong><em>' + esc(item.detail || '') + '</em></div>'
  ).join('');
}

function trendPeriods(glm) {
  const candidates = [
    ...(Array.isArray(glm.periods) ? glm.periods : []),
    glm.history24h,
    glm.history7d,
    glm.history30d,
  ].filter(Boolean);
  const byKey = new Map();
  candidates.forEach((period) => {
    if (period.key && !byKey.has(period.key)) byKey.set(period.key, period);
  });
  return TREND_PERIOD_KEYS.map((key) => byKey.get(key) || {
    key,
    label: key === '24h' ? '24小时' : (key === '7d' ? '7天' : '30天'),
    status: 'waiting',
    totalLabel: '--',
    peakLabel: '--',
    latestLabel: '--',
    bars: [],
  });
}

function trendLabel(period) {
  if (!period) return '--';
  if (period.key === '24h') return '24h';
  return period.label || period.key || '--';
}

function trendTick(period, bar, index, total) {
  if (!bar) return '';
  if (period && period.key === '24h') {
    return index % 4 === 0 || index === total - 1 ? String(bar.label || '').padStart(2, '0') : '';
  }
  return index === 0 || index === total - 1 || index % 3 === 0 ? String(bar.label || '') : '';
}

function selectedTrendIndex(period, bars) {
  if (!bars.length) return -1;
  const stored = trendSelection[period.key];
  if (Number.isInteger(stored) && stored >= 0 && stored < bars.length) return stored;
  for (let index = bars.length - 1; index >= 0; index -= 1) {
    if (Number(bars[index].used || 0) > 0) return index;
  }
  return bars.length - 1;
}

function renderTrendSummary(period, selectedBar) {
  const isHourly = period.key === '24h';
  const selectedText = selectedBar
    ? (isHourly ? String(selectedBar.label || '').padStart(2, '0') + ':00' : (selectedBar.label || '--')) + ' · ' + (selectedBar.valueLabel || '0')
    : '--';
  return '<div class="trend-summary">' +
    '<div class="trend-stat" title="' + esc(period.totalLabel || '--') + '"><span>总量</span><strong>' + esc(period.totalLabel || '--') + '</strong></div>' +
    '<div class="trend-stat" title="' + esc(period.peakLabel || '--') + '"><span>' + (isHourly ? '峰值小时' : '峰值日期') + '</span><strong>' + esc(period.peakLabel || '--') + '</strong></div>' +
    '<div class="trend-stat" title="' + esc(selectedText) + '"><span class="trend-detail">' + (isHourly ? '选中小时' : '选中日期') + '</span><strong>' + esc(selectedText) + '</strong></div>' +
  '</div>';
}

function trendEmptyText(period) {
  const states = {
    waiting: '正在读取该时段数据…',
    error: '本轮读取失败，将自动重试',
    stale: '当前显示最近成功数据',
    expired: '最近成功数据已过期，等待重新读取',
  };
  return states[period && period.status] || '该时段暂无 Token 消耗';
}

function renderTrendBars(period, selectedIndex) {
  const bars = Array.isArray(period && period.bars) ? period.bars : [];
  if (!bars.length) return '<div class="trend-empty" role="status">' + esc(trendEmptyText(period)) + '</div>';
  return '<div class="trend-bars">' + bars.map((bar, index) => {
    const used = Number(bar.used || 0);
    const pct = Math.max(0, Math.min(100, Number(bar.pct) || 0));
    const classes = 'trend-bar' + (index === selectedIndex ? ' active' : '') + (used > 0 ? '' : ' empty');
    const title = (bar.label || '') + ' · ' + (bar.valueLabel || '0');
    return '<button type="button" class="' + classes + '" data-trend-index="' + index + '" aria-label="' + esc(title) + '" aria-pressed="' + (index === selectedIndex ? 'true' : 'false') + '" title="' + esc(title) + '" style="--h:' + pct + '%"><i></i><span>' + esc(trendTick(period, bar, index, bars.length)) + '</span></button>';
  }).join('') + '</div>';
}

function attachTrendEvents(period) {
  document.querySelectorAll('[data-trend-period]').forEach((button) => {
    button.onclick = () => setTrendPeriod(button.dataset.trendPeriod);
  });
  document.querySelectorAll('[data-trend-index]').forEach((button) => {
    button.onclick = () => {
      trendSelection[period.key] = Number(button.dataset.trendIndex);
      if (lastTrendPayload) renderUsageTrend(lastTrendPayload.trends, lastTrendPayload.audit, lastTrendPayload.meta);
    };
  });
}

function setTrendPeriod(periodKey) {
  activeTrendPeriod = periodKey || '24h';
  if (lastTrendPayload) renderUsageTrend(lastTrendPayload.trends, lastTrendPayload.audit, lastTrendPayload.meta);
}

function snapshotTimeLabel(value) {
  const date = new Date(value || '');
  if (!Number.isFinite(date.getTime())) return '';
  const today = new Date();
  const sameDay = date.toDateString() === today.toDateString();
  const pad = (part) => String(part).padStart(2, '0');
  return sameDay
    ? pad(date.getHours()) + ':' + pad(date.getMinutes())
    : pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function renderUsageTrend(trends, audit, meta) {
  lastTrendPayload = { trends, audit, meta };
  const glm = trends && trends.glm ? trends.glm : {};
  const periods = trendPeriods(glm);
  if (!periods.length) {
    $('#usageTrend').innerHTML = '<div class="trend-empty">未读取到 GLM 消耗趋势</div>';
    return;
  }
  let period = periods.find((item) => item.key === activeTrendPeriod) || periods[0];
  activeTrendPeriod = period.key || '24h';
  const bars = Array.isArray(period.bars) ? period.bars : [];
  const selectedIndex = selectedTrendIndex(period, bars);
  const selectedBar = selectedIndex >= 0 ? bars[selectedIndex] : null;
  const tabs = periods.map((item) =>
    '<button type="button" class="trend-tab' + (item.key === activeTrendPeriod ? ' active' : '') + '" data-trend-period="' + esc(item.key || '') + '" aria-label="查看 ' + esc(trendLabel(item)) + ' GLM 消耗趋势" aria-pressed="' + (item.key === activeTrendPeriod ? 'true' : 'false') + '">' + esc(trendLabel(item)) + '</button>'
  ).join('');
  const auditText = (audit || []).map((item) =>
    item.status === 'ok' ? item.label + ' 已接入额度' : item.label + ' ' + item.detail
  ).join(' · ');
  const statusText = { partial: ' · 部分可用', stale: ' · 最近成功数据', expired: ' · 数据已过期', error: ' · 读取失败', waiting: ' · 读取中' }[glm.status] || '';
  const snapshotText = snapshotTimeLabel(period.capturedAt || (period.status === 'expired' && meta && meta.expiredAt) || '');
  const updatedText = snapshotText ? ' · 截至 ' + snapshotText : '';
  $('#usageTrend').title = auditText || '';
  $('#usageTrend').innerHTML =
    '<div class="trend-head"><span class="trend-title">' + esc((glm.label || 'GLM 消耗趋势') + statusText + updatedText) + '</span><div class="trend-tabs" role="group" aria-label="趋势时间范围">' + tabs + '</div></div>' +
    renderTrendSummary(period, selectedBar) +
    renderTrendBars(period, selectedIndex);
  attachTrendEvents(period);
}

function setLoad(isLoading) {
  $('#uploadButton').disabled = isLoading;
  $('#uploadButton').style.opacity = isLoading ? '0.72' : '1';
  $('#uploadLabel').textContent = isLoading ? '上报中…' : '立即上报';
}

function renderToolRows(target, tools, emptyText, scoreMode) {
  const rows = Array.isArray(tools) ? tools : [];
  $(target).innerHTML = rows.map((tool) => {
    const value = scoreMode ? (tool.scoreLabel || tool.valueLabel) : tool.valueLabel;
    return '<div class="tool" title="' + esc(tool.detail || '') + '"><span>' + esc(tool.label) + '</span><span class="bar"><i style="width:' + Math.max(4, Math.min(100, Number(tool.pct) || 0)) + '%"></i></span><span class="tool-value">' + esc(value || '--') + '</span></div>';
  }).join('') || '<div class="tool"><span>' + esc(emptyText) + '</span><span></span><span class="tool-value">--</span></div>';
}

function uploadOperationText(operation) {
  const labels = {
    running: '正在扫描并上报',
    succeeded: 'SCYS 已确认接收',
    completed: '本轮无新增数据',
    failed: '上报失败',
    interrupted: '上次上报被中断'
  };
  return labels[operation && operation.status] || '';
}

function renderUploadOperation(operation) {
  const running = operation && operation.status === 'running';
  manualUploadRunning = Boolean(running);
  setLoad(Boolean(running));
  return uploadOperationText(operation);
}

function resetIdentitySelect(message = '请先加载账号列表') {
  const select = $('#identitySelect');
  select.replaceChildren();
  const option = document.createElement('option');
  option.value = '';
  option.textContent = message;
  select.append(option);
  select.disabled = true;
  $('#identityBindButton').disabled = true;
}

function renderIdentityBinding(leaderboard, account) {
  lastIdentityPayload = { leaderboard, account };
  const connected = Boolean(account && account.connected);
  const identity = leaderboard && leaderboard.identity ? leaderboard.identity : {};
  const accountMarker = connected ? String(account.accountId || 'connected') : '';
  if (identityAccount !== accountMarker) {
    identityAccount = accountMarker;
    resetIdentitySelect();
  }
  if (leaderboard.matched) identityPanelOpen = false;
  const needsBinding = connected && !leaderboard.matched && identity.status === 'binding-required';
  if (needsBinding) identityPanelOpen = true;
  const manage = $('#identityManageButton');
  manage.hidden = true;
  $('#identityBind').hidden = !(connected && identityPanelOpen && !leaderboard.matched);
  $('#identityTitle').textContent = identity.bound
    ? '已绑定账号暂未出现在今日公开榜单'
    : '榜单账号未匹配';
  $('#identityDetail').textContent = identity.detail || '请选择一次公开榜单账号；绑定只保存在本机。';
}

async function loadLeaderboardCandidates() {
  const button = $('#identityLoadButton');
  button.disabled = true;
  button.textContent = '读取中';
  resetIdentitySelect('正在读取公开榜单...');
  try {
    const response = await fetch(API + '/leaderboard-candidates', { method: 'POST' });
    const result = await response.json();
    const entries = Array.isArray(result.entries) ? result.entries : [];
    if (!entries.length) throw new Error(result.error || '公开榜单暂未返回账号');
    const select = $('#identitySelect');
    select.replaceChildren();
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '选择你的榜单账号';
    select.append(placeholder);
    entries.forEach((entry) => {
      const option = document.createElement('option');
      option.value = entry.userId;
      option.textContent = [entry.rankLabel, entry.name, entry.city, entry.scoreLabel].filter(Boolean).join(' · ');
      select.append(option);
    });
    if (result.selectedUserId && entries.some((entry) => entry.userId === result.selectedUserId)) {
      select.value = result.selectedUserId;
    }
    select.disabled = false;
    $('#identityBindButton').disabled = !select.value;
    $('#identityDetail').textContent = '只保存所选公开榜单 ID 与排名快照；不会额外上传本地内容。';
  } catch (error) {
    resetIdentitySelect('账号列表读取失败');
    $('#identityDetail').textContent = String((error && error.message) || error || '账号列表读取失败');
  } finally {
    button.disabled = false;
    button.textContent = '刷新';
  }
}

async function bindLeaderboardIdentity() {
  const select = $('#identitySelect');
  const button = $('#identityBindButton');
  if (!select.value) return;
  button.disabled = true;
  button.textContent = '绑定中';
  try {
    const response = await fetch(API + '/leaderboard-bind', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ userId: select.value })
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '榜单账号绑定失败');
    identityPanelOpen = false;
    $('#serviceText').textContent = '榜单账号已绑定，正在刷新排名';
    await load();
  } catch (error) {
    $('#identityDetail').textContent = String((error && error.message) || error || '榜单账号绑定失败');
  } finally {
    button.textContent = '确认';
    button.disabled = !select.value;
  }
}

function render(data) {
  if (!data || !data.ok) return;
  const overall = data.overallUsage || {};
  const leaderboard = data.leaderboard || {};
  const account = data.account && data.account.connected
    ? 'scys ' + data.account.accountId
    : '未绑定 scys';
  const daemon = data.service && data.service.running ? 'service 正常' : 'service 状态未知';
  const operation = data.sync && data.sync.manualUpload;
  const operationText = renderUploadOperation(operation);
  const boardSyncCaption = data.sync && data.sync.leaderboardSync && data.sync.leaderboardSync.caption;
  const runningUpload = operation && operation.status === 'running';
  const failedUpload = operation && operation.status === 'failed';

  const heroScore = (leaderboard.scoreLabel && leaderboard.scoreLabel !== '--')
    ? leaderboard.scoreLabel
    : (data.leaderboardTotalLabel && data.leaderboardTotalLabel !== '--' ? data.leaderboardTotalLabel : '');
  if (heroScore) lastHeroScore = heroScore;
  $('#totalValue').textContent = lastHeroScore;
  $('#totalCaption').textContent = '榜单分';
  const rankLive = Boolean(leaderboard.matched) && leaderboard.status !== 'stale';
  $('#rankCaption').textContent = leaderboard.rankCaption || (rankLive ? '总榜' : '未进公开榜');
  $('#rankValue').textContent = rankLive ? (leaderboard.rankLabel || data.rankLabel || '#--') : '#--';
  document.querySelector('.rank').classList.toggle('stale', !rankLive);
  const localUsageText = overall.totalLabel || data.actualTotalLabel || '';
  if (localUsageText && localUsageText !== '--') lastLocalUsage = localUsageText;
  const rankFacts = data.rankFacts;
  if (rankFacts && Array.isArray(rankFacts.items) && rankFacts.items[0] && (!rankFacts.items[0].valueLabel || rankFacts.items[0].valueLabel === '--') && lastLocalUsage !== '--') {
    rankFacts.items[0].valueLabel = lastLocalUsage;
  }
  renderRankFacts(rankFacts);
  renderSyncFacts(data.sync && data.sync.facts);
  const sync = runningUpload || failedUpload
    ? (operationText || (data.sync && data.sync.label) || '等待同步')
    : (boardSyncCaption || (data.sync && data.sync.label) || operationText || '等待同步');
  $('#serviceText').textContent = account + ' · ' + (data.date || '--') + ' · ' + sync + ' · ' + daemon;
  $('#serviceText').title = (data.sync && data.sync.detail) || '';
  const completeness = { full: '完整快照', observed: '增量快照', waiting: '等待统计' }[overall.completeness] || overall.status || '等待统计';
  $('#localUsageState').textContent = completeness;
  renderQuotaFeeds(data.quotaFeeds);
  renderToolRows('#toolList', overall.tools || data.tools, '本机暂无数据', false);
  renderToolRows('#leaderboardToolList', leaderboard.tools || data.leaderboardTools, '榜单暂未返回工具构成', true);
  renderIdentityBinding(leaderboard, data.account || {});
  const glmTrends = data.glm && data.glm.trends ? { glm: data.glm.trends } : data.usageTrends;
  renderUsageTrend(glmTrends, data.quotaAudit, data.glm);
  icons();
}

function setRefreshPaused(paused) {
  refreshPaused = paused;
  $('#pauseButton').classList.toggle('active', paused);
  $('#pauseButton').title = paused ? '继续面板自动刷新' : '暂停面板自动刷新，不影响后台统计和上报';
  $('#pauseLabel').textContent = paused ? '继续刷新' : '暂停刷新';
}

function toggleRefreshPause() {
  setRefreshPaused(!refreshPaused);
  if (!refreshPaused) load();
}

async function openLogs() {
  const button = $('#logButton');
  button.disabled = true;
  try {
    const response = await fetch(API + '/open-logs', { method: 'POST' });
    const result = await response.json();
    $('#serviceText').textContent = result.ok ? '已打开本地日志' : '日志打开失败';
  } catch {
    $('#serviceText').textContent = '日志打开失败';
  } finally {
    button.disabled = false;
  }
}

async function openLeaderboard() {
  const button = $('#leaderboardButton');
  button.disabled = true;
  try {
    const response = await fetch(API + '/open-leaderboard', { method: 'POST' });
    const result = await response.json();
    $('#serviceText').textContent = result.ok ? '已打开真实榜单' : '榜单打开失败';
  } catch {
    $('#serviceText').textContent = '榜单打开失败';
  } finally {
    button.disabled = false;
  }
}

async function load(force) {
  if (refreshPaused && !force) return;
  const sequence = ++loadSequence;
  if (loadController) loadController.abort();
  loadController = new AbortController();
  try {
    const response = await fetch(API + '/summary', { cache: 'no-store', signal: loadController.signal });
    const data = await response.json();
    if (sequence === loadSequence) render(data);
    return data;
  } catch (error) {
    if (error && error.name !== 'AbortError' && sequence === loadSequence) $('#serviceText').textContent = '本地 API 不可用';
  }
}

async function pollSyncUntilSettled() {
  syncPolling = true;
  try {
    const deadline = Date.now() + 30000;
    let data = await load(true);
    while (Date.now() < deadline) {
      const status = data && data.sync && data.sync.leaderboardSync && data.sync.leaderboardSync.status;
      if (status !== 'scheduled' && status !== 'running') return data;
      await new Promise((resolve) => setTimeout(resolve, 1000));
      data = await load(true);
    }
    return data;
  } finally {
    syncPolling = false;
  }
}

$('#uploadButton').onclick = async () => {
  setLoad(true);
  try {
    const response = await fetch(API + '/upload', { method: 'POST' });
    const result = await response.json();
    if (result.async) {
      $('#serviceText').textContent = result.operation && result.operation.joined ? '已加入正在进行的上报任务' : '后台上报已启动';
      $('#serviceText').title = result.message || '';
    } else if (result.ok) {
      $('#serviceText').textContent = '上报成功';
      $('#serviceText').title = '';
    } else {
      const detail = String(result.output || result.error || '上报失败').slice(0, 120);
      $('#serviceText').textContent = '上报失败：' + detail;
      $('#serviceText').title = String(result.output || result.error || '');
    }
    await pollSyncUntilSettled();
  } catch (error) {
    $('#serviceText').textContent = '上报请求失败：server 未响应或网络错误';
    $('#serviceText').title = String((error && error.message) || error || '');
  } finally {
    if (!manualUploadRunning) setLoad(false);
  }
};

$('#pauseButton').onclick = toggleRefreshPause;
$('#leaderboardButton').onclick = openLeaderboard;
$('#logButton').onclick = openLogs;
$('#identityManageButton').onclick = () => {
  identityPanelOpen = !identityPanelOpen;
  if (lastIdentityPayload) renderIdentityBinding(lastIdentityPayload.leaderboard, lastIdentityPayload.account);
  if (identityPanelOpen) loadLeaderboardCandidates();
};
$('#identityLoadButton').onclick = loadLeaderboardCandidates;
$('#identitySelect').onchange = () => { $('#identityBindButton').disabled = !$('#identitySelect').value; };
$('#identityBindButton').onclick = bindLeaderboardIdentity;

icons();
load();
setInterval(() => {
  if (!refreshPaused && !syncPolling) load();
}, 10000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) load();
});
window.addEventListener('focus', load);
document.body.addEventListener('pointerenter', () => load());
</script></body></html>

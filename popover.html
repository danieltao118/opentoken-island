  <style>
    :root { color-scheme: dark; --bg:#050505; --panel:#111112; --line:rgba(255,255,255,.16); --ink:#f7f7f8; --muted:rgba(247,247,248,.62); --blue:#0a84ff; --green:#30d158; --gold:#d8bf85; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; }

    .panel{position:relative;width:100%;height:100%;min-height:0;padding:14px;border-radius:24px;background:linear-gradient(145deg,rgba(32,34,38,.72),rgba(18,18,20,.82));border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);overflow:hidden;isolation:isolate}
    .panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 36%);opacity:.55;z-index:0}

    .symbol-bg img{height:122px;width:477px;object-fit:contain;object-position:left center;display:block}.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding-right:2px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.title{margin:0;font-size:15px;font-weight:760}.sub{margin:4px 0 0;color:var(--muted);font-size:12px;max-width:278px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:99px;background:rgba(48,209,88,.12);color:#77df8b;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.14)}
    .actions{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:10px}.btn{height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:700}.btn.primary{background:var(--blue);color:white;border-color:rgba(10,132,255,.6);box-shadow:0 12px 34px rgba(10,132,255,.22)}.btn.active{background:rgba(255,159,10,.14);border-color:rgba(255,159,10,.24);color:#ffd798}.btn.icon{width:34px;padding:0}.btn svg{width:15px;height:15px}
    .hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);margin-bottom:10px}.label{margin:0 0 6px;color:var(--muted);font-size:12px}.value{margin:0;font-size:32px;line-height:1;font-weight:780;font-variant-numeric:tabular-nums}.rank{display:grid;place-items:center;min-width:66px;height:42px;padding:0 10px;border-radius:13px;background:rgba(10,132,255,.18);color:#8cc7ff;font-size:18px;font-weight:820;font-variant-numeric:tabular-nums}
    .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}.fact{min-width:0;border-radius:16px;padding:9px 10px;background:rgba(255,255,255,.052);border:1px solid rgba(255,255,255,.075)}.fact span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact strong{display:block;margin-top:4px;font-size:18px;line-height:1.05;font-weight:820;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact em{display:block;margin-top:5px;color:rgba(247,247,248,.56);font-style:normal;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}.bar i{display:block;height:100%;width:72%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#64d2ff)}.tools{display:grid;gap:6px;margin-bottom:10px}.tool{display:grid;grid-template-columns:82px 1fr 66px;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:rgba(255,255,255,.045);font-size:12px}.tool .bar{height:7px}.tool-value{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.trend-panel{margin-top:auto;display:grid;gap:8px;padding:10px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.075);min-height:0}.trend-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.trend-title{font-size:13px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.trend-card{min-width:0;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}.trend-card strong{display:flex;justify-content:space-between;gap:6px;font-size:11px;line-height:1.1}.trend-total{color:#8ee59e;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-bars{height:38px;margin-top:7px;display:flex;align-items:flex-end;gap:2px}.trend-bars i{flex:1;min-width:2px;min-height:3px;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#8ee59e,var(--blue));opacity:.9}.trend-empty{height:38px;margin-top:7px;display:grid;place-items:center;color:var(--muted);font-size:11px}.audit-line{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quotas{display:block;margin-bottom:10px}.quota{min-width:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12px;overflow:hidden}.quota-card-wide{width:100%}.quota-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}.quota strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota-state{min-width:34px;text-align:right;color:rgba(255,255,255,.72);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota-summary{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota-plan{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;background:rgba(48,209,88,.12);color:#8ee59e;font-size:11px;font-weight:760}.quota-items{display:grid;gap:8px;margin-top:9px}.quota-item{min-width:0;padding-top:8px;border-top:1px solid rgba(255,255,255,.09)}.quota-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:10px}.quota-name{font-size:13px;font-weight:760;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota-remaining{font-size:17px;line-height:1;font-weight:830;font-variant-numeric:tabular-nums;color:#8ee59e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota-detail{display:block;margin-top:5px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quota .bar{height:6px;margin-top:6px}
    .hero{padding:10px 12px;margin-bottom:8px}.value{font-size:28px}.rank{min-width:70px;height:42px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.rank span{font-size:9px;font-weight:700;letter-spacing:.08em;color:rgba(140,199,255,.72)}.rank strong{font-size:17px;line-height:1;font-weight:820}.facts{gap:6px;margin-bottom:8px}.fact{padding:7px 8px;border-radius:13px}.fact strong{margin-top:3px;font-size:16px}.fact em{display:block}.quotas{margin-bottom:8px}.quota{padding:8px 10px;border-radius:14px}.quota-summary{margin-top:3px}.quota-items{gap:5px;margin-top:7px}.quota-item{padding-top:6px}.quota-detail{margin-top:3px;font-size:11px}.quota .bar{height:5px;margin-top:5px}.tools{gap:4px;margin-bottom:8px}.tool{grid-template-columns:82px 1fr 62px;padding:5px 7px;border-radius:10px}.trend-panel{margin-top:0;gap:7px;padding:9px;min-height:150px}.trend-head{grid-template-columns:minmax(0,1fr) auto}.trend-tabs{display:flex;gap:4px;padding:2px;border-radius:999px;background:rgba(255,255,255,.06)}.trend-tab{height:28px;min-width:38px;padding:0 9px;border-radius:999px;background:transparent;color:var(--muted);font-size:11px;font-weight:760}.trend-tab.active{background:rgba(255,255,255,.16);color:#fff}.trend-tab:focus-visible,.trend-bar:focus-visible{outline:2px solid #64d2ff;outline-offset:1px}.trend-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.trend-stat{min-width:0;padding:5px 6px;border-radius:10px;background:rgba(255,255,255,.045)}.trend-stat span,.trend-detail{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-stat strong{display:block;margin-top:2px;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-bars{height:48px;margin-top:0;display:flex;align-items:stretch;gap:2px}.trend-bar{flex:1;min-width:0;height:100%;display:grid;grid-template-rows:1fr 10px;align-items:end;gap:2px;padding:0;background:transparent}.trend-bar i{display:block;width:100%;height:max(2px,var(--h));border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#8ee59e,var(--blue));opacity:.9}.trend-bar.empty i{height:2px;background:rgba(255,255,255,.18);opacity:.55}.trend-bar.active i{box-shadow:0 0 0 1px rgba(255,255,255,.38),0 0 14px rgba(10,132,255,.26);opacity:1}.trend-bar span{height:10px;color:rgba(247,247,248,.48);font-size:9px;text-align:center;white-space:nowrap;overflow:hidden}.trend-empty{min-height:48px;height:auto;margin:0;padding:8px;display:grid;place-items:center;text-align:center;white-space:normal;line-height:1.45}.content{scrollbar-gutter:stable}.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{border-radius:99px;background:rgba(255,255,255,.18)}.audit-line{display:none}
  </style>
</head><body><main class="panel"><span class="symbol-bg"><img src="./assets/scys/icon_topnav.png" alt=""></span><div class="content"><header class="head"><div><p class="title">今日 OpenToken</p><p id="serviceText" class="sub" role="status" aria-live="polite">Loading opentoken service...</p></div><span class="live"><span class="dot"></span>live</span></header><div class="actions"><button id="uploadButton" class="btn primary"><i data-lucide="upload-cloud"></i><span id="uploadLabel">Upload now</span></button><button id="pauseButton" class="btn" title="暂停面板自动刷新，不影响后台统计和上报"><i data-lucide="pause"></i><span id="pauseLabel">暂停刷新</span></button><button id="leaderboardButton" class="btn icon" aria-label="打开真实榜单" title="用默认浏览器打开生财有术 Token 消耗排行榜"><i data-lucide="external-link"></i></button><button id="logButton" class="btn icon" aria-label="打开日志" title="打开本地事件日志"><i data-lucide="file-text"></i></button></div><section class="hero" aria-label="今日实际 Token 与榜单排名"><div><p class="label">实际 Token（原始）</p><p id="totalValue" class="value">--</p></div><div class="rank"><span>榜单</span><strong id="rankValue">#--</strong></div></section><section id="toolList" class="tools" aria-label="工具消耗明细"></section><section id="rankFacts" class="facts" aria-label="榜单指标"></section><section id="quotaList" class="quotas" aria-label="GLM 额度"></section><section id="usageTrend" class="trend-panel" aria-label="GLM 消耗趋势"></section></div></main><script>
const API = '/api';
const $ = (selector) => document.querySelector(selector);
let refreshPaused = false;
let activeTrendPeriod = '24h';
let lastTrendPayload = null;
const trendSelection = {};
const TREND_PERIOD_KEYS = ['24h', '7d', '30d'];

function icons() {
  if (window.lucide) lucide.createIcons();
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function quotaList() {
  let list = document.querySelector("#quotaList");
  if (!list) {
    list = document.createElement('section');
    list.id = 'quotaList';
    list.className = 'quotas';
    const trend = $('#usageTrend');
    if (trend) trend.before(list);
  }
  return list;
}

function defaultQuotaFeeds() {
  return [{
    label: 'GLM / Z.ai',
    valueLabel: '--',
    detail: '等待额度上报',
    status: 'waiting',
    items: [{
      label: '5小时额度',
      valueLabel: '--',
      detail: '等待智谱额度数据 · 等待重置时间',
      pct: 4
    }, {
      label: 'MCP额度',
      valueLabel: '--',
      detail: '等待智谱 MCP 数据 · 等待重置时间',
      pct: 4
    }]
  }];
}

function quotaItemDetail(item) {
  return item.resetLabel || item.detail || '--';
}

function quotaRemainingText(item) {
  if (item.remainingLabel) return item.remainingLabel;
  const pct = Number(item.pct);
  if (Number.isFinite(pct)) return '剩余 ' + Math.max(0, 100 - Math.round(pct)) + '%';
  return '--';
}

function renderQuotaItems(feed) {
  const items = Array.isArray(feed.items) && feed.items.length ? feed.items : [{
    label: feed.label,
    valueLabel: feed.valueLabel,
    detail: feed.detail,
    pct: feed.pct
  }];
  return items.slice(0, 3).map((item) =>
    '<div class="quota-item"><div class="quota-line"><span class="quota-name">' + esc(item.label) + '</span><span class="quota-remaining">' + esc(quotaRemainingText(item)) + '</span></div><span class="quota-detail">' + esc(quotaItemDetail(item)) + '</span><span class="bar"><i style="width:' + Math.max(4, Math.min(100, Number(item.pct) || 0)) + '%"></i></span></div>'
  ).join('');
}

function renderGlmQuotaCard(feed) {
  const plan = feed.levelLabel ? '<span class="quota-plan">' + esc(feed.levelLabel) + '</span>' : '';
  const statusLabels = { ok: '正常', partial: '部分可用', stale: '数据暂旧', waiting: '读取中', error: '读取失败' };
  const status = esc(statusLabels[feed.status] || feed.status || '读取中');
  return '<div class="quota quota-card-wide"><div class="quota-head"><strong>' + esc(feed.label) + '</strong><span class="quota-state">' + status + '</span></div><span class="quota-summary">' + esc(feed.detail || feed.valueLabel || '--') + plan + '</span><div class="quota-items">' + renderQuotaItems(feed) + '</div></div>';
}

function renderQuotaFeeds(feeds) {
  const list = feeds && feeds.length ? feeds : defaultQuotaFeeds();
  const glm = list.find((feed) => feed && feed.key === 'glm') || list[0] || defaultQuotaFeeds()[0];
  quotaList().innerHTML = renderGlmQuotaCard(glm);
}

function renderRankFacts(facts) {
  const fallback = [
    { label: '榜单分', valueLabel: '--', detail: '等待排行榜匹配' },
    { label: '距上一名', valueLabel: '--', detail: '等待榜单数据' },
    { label: '同步状态', valueLabel: '等待', detail: '等待上传' }
  ];
  const items = facts && Array.isArray(facts.items) && facts.items.length ? facts.items : fallback;
  $('#rankFacts').innerHTML = items.slice(0, 3).map((item) =>
    '<div class="fact" title="' + esc(item.detail || '') + '"><span>' + esc(item.label || '--') + '</span><strong>' + esc(item.valueLabel || '--') + '</strong><em>' + esc(item.detail || '') + '</em></div>'
  ).join('');
}

function trendPeriods(glm) {
  const candidates = [
    ...(Array.isArray(glm.periods) ? glm.periods : []),
    glm.history24h,
    glm.history7d,
    glm.history30d,
  ].filter(Boolean);
  const byKey = new Map();
  candidates.forEach((period) => {
    if (period.key && !byKey.has(period.key)) byKey.set(period.key, period);
  });
  return TREND_PERIOD_KEYS.map((key) => byKey.get(key) || {
    key,
    label: key === '24h' ? '24小时' : (key === '7d' ? '7天' : '30天'),
    status: 'waiting',
    totalLabel: '--',
    peakLabel: '--',
    latestLabel: '--',
    bars: [],
  });
}

function trendLabel(period) {
  if (!period) return '--';
  if (period.key === '24h') return '24h';
  return period.label || period.key || '--';
}

function trendTick(period, bar, index, total) {
  if (!bar) return '';
  if (period && period.key === '24h') {
    return index % 4 === 0 || index === total - 1 ? String(bar.label || '').padStart(2, '0') : '';
  }
  return index === 0 || index === total - 1 || index % 3 === 0 ? String(bar.label || '') : '';
}

function selectedTrendIndex(period, bars) {
  if (!bars.length) return -1;
  const stored = trendSelection[period.key];
  if (Number.isInteger(stored) && stored >= 0 && stored < bars.length) return stored;
  for (let index = bars.length - 1; index >= 0; index -= 1) {
    if (Number(bars[index].used || 0) > 0) return index;
  }
  return bars.length - 1;
}

function renderTrendSummary(period, selectedBar) {
  const isHourly = period.key === '24h';
  const selectedText = selectedBar
    ? (isHourly ? String(selectedBar.label || '').padStart(2, '0') + ':00' : (selectedBar.label || '--')) + ' · ' + (selectedBar.valueLabel || '0')
    : '--';
  return '<div class="trend-summary">' +
    '<div class="trend-stat"><span>总量</span><strong>' + esc(period.totalLabel || '--') + '</strong></div>' +
    '<div class="trend-stat"><span>' + (isHourly ? '峰值小时' : '峰值日期') + '</span><strong>' + esc(period.peakLabel || '--') + '</strong></div>' +
    '<div class="trend-stat"><span class="trend-detail">' + (isHourly ? '选中小时' : '选中日期') + '</span><strong>' + esc(selectedText) + '</strong></div>' +
  '</div>';
}

function trendEmptyText(period) {
  const states = {
    waiting: '正在读取该时段数据…',
    error: '本轮读取失败，将自动重试',
    stale: '当前显示最近成功数据',
  };
  return states[period && period.status] || '该时段暂无 Token 消耗';
}

function renderTrendBars(period, selectedIndex) {
  const bars = Array.isArray(period && period.bars) ? period.bars : [];
  if (!bars.length) return '<div class="trend-empty" role="status">' + esc(trendEmptyText(period)) + '</div>';
  return '<div class="trend-bars">' + bars.map((bar, index) => {
    const used = Number(bar.used || 0);
    const pct = Math.max(0, Math.min(100, Number(bar.pct) || 0));
    const classes = 'trend-bar' + (index === selectedIndex ? ' active' : '') + (used > 0 ? '' : ' empty');
    const title = (bar.label || '') + ' · ' + (bar.valueLabel || '0');
    return '<button type="button" class="' + classes + '" data-trend-index="' + index + '" aria-label="' + esc(title) + '" aria-pressed="' + (index === selectedIndex ? 'true' : 'false') + '" title="' + esc(title) + '" style="--h:' + pct + '%"><i></i><span>' + esc(trendTick(period, bar, index, bars.length)) + '</span></button>';
  }).join('') + '</div>';
}

function attachTrendEvents(period) {
  document.querySelectorAll('[data-trend-period]').forEach((button) => {
    button.onclick = () => setTrendPeriod(button.dataset.trendPeriod);
  });
  document.querySelectorAll('[data-trend-index]').forEach((button) => {
    button.onclick = () => {
      trendSelection[period.key] = Number(button.dataset.trendIndex);
      if (lastTrendPayload) renderUsageTrend(lastTrendPayload.trends, lastTrendPayload.audit);
    };
  });
}

function setTrendPeriod(periodKey) {
  activeTrendPeriod = periodKey || '24h';
  if (lastTrendPayload) renderUsageTrend(lastTrendPayload.trends, lastTrendPayload.audit);
}

function renderUsageTrend(trends, audit) {
  lastTrendPayload = { trends, audit };
  const glm = trends && trends.glm ? trends.glm : {};
  const periods = trendPeriods(glm);
  if (!periods.length) {
    $('#usageTrend').innerHTML = '<div class="trend-empty">未读取到 GLM 消耗趋势</div>';
    return;
  }
  let period = periods.find((item) => item.key === activeTrendPeriod) || periods[0];
  activeTrendPeriod = period.key || '24h';
  const bars = Array.isArray(period.bars) ? period.bars : [];
  const selectedIndex = selectedTrendIndex(period, bars);
  const selectedBar = selectedIndex >= 0 ? bars[selectedIndex] : null;
  const tabs = periods.map((item) =>
    '<button type="button" class="trend-tab' + (item.key === activeTrendPeriod ? ' active' : '') + '" data-trend-period="' + esc(item.key || '') + '" aria-label="查看 ' + esc(trendLabel(item)) + ' GLM 消耗趋势" aria-pressed="' + (item.key === activeTrendPeriod ? 'true' : 'false') + '">' + esc(trendLabel(item)) + '</button>'
  ).join('');
  const auditText = (audit || []).map((item) =>
    item.status === 'ok' ? item.label + ' 已接入额度' : item.label + ' ' + item.detail
  ).join(' · ');
  const statusText = { partial: ' · 部分可用', stale: ' · 最近成功数据', error: ' · 读取失败', waiting: ' · 读取中' }[glm.status] || '';
  $('#usageTrend').title = auditText || '';
  $('#usageTrend').innerHTML =
    '<div class="trend-head"><span class="trend-title">' + esc((glm.label || 'GLM 消耗趋势') + statusText) + '</span><div class="trend-tabs" role="group" aria-label="趋势时间范围">' + tabs + '</div></div>' +
    renderTrendSummary(period, selectedBar) +
    renderTrendBars(period, selectedIndex);
  attachTrendEvents(period);
}

function setLoad(isLoading) {
  $('#uploadButton').disabled = isLoading;
  $('#uploadButton').style.opacity = isLoading ? '0.72' : '1';
  $('#uploadLabel').textContent = isLoading ? 'Uploading...' : 'Upload now';
}

function render(data) {
  if (!data || !data.ok) return;
  if (data.waiting) {
    const account = data.account && data.account.connected
      ? 'scys ' + data.account.accountId
      : '未绑定 scys';
    const daemon = data.service && data.service.running ? 'daemon running' : 'service unknown';
    $('#totalValue').textContent = '--';
    $('#rankValue').textContent = '#--';
    renderRankFacts(data.rankFacts);
    const sync = data.sync && data.sync.label ? data.sync.label : 'proxy listening';
    $('#serviceText').textContent = account + ' · ' + sync + ' · ' + daemon;
    $('#serviceText').title = data.sync && data.sync.detail ? data.sync.detail : '';
    renderQuotaFeeds(data.quotaFeeds);
    $('#toolList').innerHTML = '<div class="tool"><span>Waiting</span><span></span><span class="tool-value">--</span></div>';
    renderUsageTrend(data.usageTrends, data.quotaAudit);
    icons();
    return;
  }
  const total = data.actualTotal || data.total || 0;
  const rank = data.rank || null;
  const account = data.account && data.account.connected
    ? 'scys ' + data.account.accountId
    : '未绑定 scys';
  const daemon = data.service && data.service.running ? 'daemon running' : 'service unknown';

  $('#totalValue').textContent = data.actualTotalLabel || data.totalLabel || '0';
  $('#rankValue').textContent = data.rankLabel || (rank ? '#' + rank : '#--');
  renderRankFacts(data.rankFacts);
  const sync = data.runtime && data.runtime.refreshingUsage
    ? '正在刷新本地统计'
    : (data.sync && data.sync.label ? data.sync.label : (data.source || 'synced'));
  $('#serviceText').textContent = account + ' · ' + data.date + ' · ' + sync + ' · ' + daemon;
  $('#serviceText').title = (data.runtime && data.runtime.opentokenBin) || (data.sync && data.sync.detail) || '';
  renderQuotaFeeds(data.quotaFeeds);
  $('#toolList').innerHTML = (data.tools || []).map((tool) =>
    '<div class="tool" title="' + esc(tool.detail || '') + '"><span>' + esc(tool.label) + '</span><span class="bar"><i style="width:' + tool.pct + '%"></i></span><span class="tool-value">' + esc(tool.valueLabel) + '</span></div>'
  ).join('') || '<div class="tool"><span>No data</span><span></span><span class="tool-value">--</span></div>';
  renderUsageTrend(data.usageTrends, data.quotaAudit);
  icons();
}

function setRefreshPaused(paused) {
  refreshPaused = paused;
  $('#pauseButton').classList.toggle('active', paused);
  $('#pauseButton').title = paused ? '继续面板自动刷新' : '暂停面板自动刷新，不影响后台统计和上报';
  $('#pauseLabel').textContent = paused ? '继续刷新' : '暂停刷新';
}

function toggleRefreshPause() {
  setRefreshPaused(!refreshPaused);
  if (!refreshPaused) load();
}

async function openLogs() {
  const button = $('#logButton');
  button.disabled = true;
  try {
    const response = await fetch(API + '/open-logs', { method: 'POST' });
    const result = await response.json();
    $('#serviceText').textContent = result.ok ? '已打开本地日志' : '日志打开失败';
  } catch {
    $('#serviceText').textContent = '日志打开失败';
  } finally {
    button.disabled = false;
  }
}

async function openLeaderboard() {
  const button = $('#leaderboardButton');
  button.disabled = true;
  try {
    const response = await fetch(API + '/open-leaderboard', { method: 'POST' });
    const result = await response.json();
    $('#serviceText').textContent = result.ok ? '已打开真实榜单' : '榜单打开失败';
  } catch {
    $('#serviceText').textContent = '榜单打开失败';
  } finally {
    button.disabled = false;
  }
}

async function load() {
  if (refreshPaused) return;
  try {
    const response = await fetch(API + '/summary', { cache: 'no-store' });
    render(await response.json());
  } catch (error) {
    $('#serviceText').textContent = 'Live API unavailable';
  }
}

$('#uploadButton').onclick = async () => {
  setLoad(true);
  try {
    const response = await fetch(API + '/upload', { method: 'POST' });
    const result = await response.json();
    if (result.async) {
      $('#serviceText').textContent = '后台上报已触发，稍后自动刷新';
      $('#serviceText').title = result.message || '';
    } else if (result.ok) {
      $('#serviceText').textContent = '上报成功';
      $('#serviceText').title = '';
    } else {
      const detail = String(result.output || result.error || '上报失败').slice(0, 120);
      $('#serviceText').textContent = '上报失败：' + detail;
      $('#serviceText').title = String(result.output || result.error || '');
    }
    await load();
  } catch (error) {
    $('#serviceText').textContent = '上报请求失败：server 未响应或网络错误';
    $('#serviceText').title = String((error && error.message) || error || '');
  } finally {
    setLoad(false);
  }
};

$('#pauseButton').onclick = toggleRefreshPause;
$('#leaderboardButton').onclick = openLeaderboard;
$('#logButton').onclick = openLogs;

icons();
load();
setInterval(() => {
  if (!refreshPaused) load();
}, 10000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) load();
});
window.addEventListener('focus', load);
document.body.addEventListener('pointerenter', () => load());
</script></body></html>

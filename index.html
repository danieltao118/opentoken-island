<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenToken Island</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --ink: #f7f7f8;
      --muted: rgba(247,247,248,.62);
      --blue: #0a84ff;
      --green: #30d158;
      --gold: #d8bf85;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(10,132,255,.22), transparent 30%),
        radial-gradient(circle at 88% 4%, rgba(48,209,88,.14), transparent 28%),
        var(--bg);
      color: var(--ink);
    }
    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    main {
      width: min(1120px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 28px 0;
    }
    .shell {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(32,34,38,.72), rgba(18,18,20,.86));
      box-shadow: 0 28px 90px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
    }
    header {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 22px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.09);
      font-size: 13px;
      font-weight: 720;
    }
    .btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: rgba(10,132,255,.62);
    }
    .btn.icon {
      width: 36px;
      padding: 0;
    }
    .btn svg {
      width: 16px;
      height: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px;
      padding: 18px;
    }
    section {
      min-width: 0;
      padding: 16px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: end;
      gap: 18px;
    }
    .label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .value {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }
    .rank {
      min-width: 96px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff;
      color: #06070a;
      font-size: 28px;
      font-weight: 860;
      font-variant-numeric: tabular-nums;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 10px;
      grid-column: 1 / -1;
    }
    .fact span,
    .tool span,
    .quota span,
    .trend span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fact strong {
      display: block;
      margin-top: 6px;
      font-size: 23px;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fact em {
      display: block;
      margin-top: 6px;
      color: rgba(247,247,248,.56);
      font-style: normal;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list {
      display: grid;
      gap: 9px;
    }
    .tool {
      display: grid;
      grid-template-columns: 108px minmax(0,1fr) 88px;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.045);
    }
    .tool strong {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar {
      height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,.10);
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #64d2ff);
    }
    .quota h2,
    .trend h2,
    .tools h2 {
      margin: 0 0 11px;
      font-size: 15px;
    }
    .quota-row {
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .quota-row:first-of-type {
      border-top: 0;
      padding-top: 0;
    }
    .quota-line {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: baseline;
    }
    .quota-line strong {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quota-line b {
      color: #8ee59e;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }
    .quota-row .bar {
      margin-top: 8px;
      height: 7px;
    }
    .trend-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 10px;
    }
    .trend-card {
      min-width: 0;
      padding: 10px;
      border-radius: 13px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.06);
    }
    .trend-card strong {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .trend-total {
      color: #8ee59e;
      font-variant-numeric: tabular-nums;
    }
    .trend-bars {
      height: 52px;
      margin-top: 10px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }
    .trend-bars i {
      flex: 1;
      min-width: 2px;
      min-height: 3px;
      border-radius: 4px 4px 1px 1px;
      background: linear-gradient(180deg,#8ee59e,var(--blue));
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 0;
    }
    iframe {
      width: 100%;
      height: 520px;
      border: 0;
      border-radius: 18px;
      background: transparent;
    }
    .preview {
      grid-column: 1 / -1;
      padding: 0;
      background: transparent;
      border: 0;
    }
    @media (max-width: 860px) {
      header,
      .grid,
      .hero,
      .facts,
      .trend-grid {
        grid-template-columns: 1fr;
      }
      .actions {
        flex-wrap: wrap;
      }
      .rank {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <header>
        <div>
          <h1>OpenToken Island</h1>
          <p id="serviceText" class="sub">正在读取本机真实数据...</p>
        </div>
        <div class="actions">
          <button id="uploadButton" class="btn primary" type="button"><i data-lucide="upload-cloud"></i><span id="uploadLabel">立即上报</span></button>
          <button id="reloadButton" class="btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
          <button id="leaderboardButton" class="btn icon" type="button" aria-label="打开真实榜单" title="用默认浏览器打开生财有术 Token 消耗排行榜"><i data-lucide="external-link"></i></button>
          <button id="logButton" class="btn icon" type="button" aria-label="打开日志" title="打开本地事件日志"><i data-lucide="file-text"></i></button>
        </div>
      </header>
      <div class="grid">
        <section class="hero">
          <div>
            <p class="label">今日 OpenToken</p>
            <p id="totalValue" class="value">--</p>
          </div>
          <div id="rankValue" class="rank">#--</div>
        </section>
        <section class="quota">
          <h2>GLM / Z.ai 额度</h2>
          <div id="quotaList" class="list"><div class="empty">等待真实额度数据...</div></div>
        </section>
        <section id="rankFacts" class="facts"></section>
        <section class="tools">
          <h2>Agent 使用量</h2>
          <div id="toolList" class="list"><div class="empty">等待真实使用量...</div></div>
        </section>
        <section class="trend">
          <h2>GLM 消耗趋势</h2>
          <div id="usageTrend" class="trend-grid"><div class="empty">等待真实趋势数据...</div></div>
        </section>
        <section class="preview">
          <iframe src="./popover.html" title="OpenToken Island tray panel"></iframe>
        </section>
      </div>
    </div>
  </main>
  <script>
    const API = '/api';
    const $ = (selector) => document.querySelector(selector);

    function icons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function quotaRemainingText(item) {
      if (item.remainingLabel) return item.remainingLabel;
      const pct = Number(item.pct);
      if (Number.isFinite(pct)) return '剩余 ' + Math.max(0, 100 - Math.round(pct)) + '%';
      return '--';
    }

    function renderQuota(feeds) {
      const list = Array.isArray(feeds) ? feeds : [];
      const feed = list.find((item) => item && item.key === 'glm');
      const items = feed && Array.isArray(feed.items) ? feed.items : [];
      if (!items.length) {
        $('#quotaList').innerHTML = '<div class="empty">未读取到 Z.ai 额度数据</div>';
        return;
      }
      $('#quotaList').innerHTML = items.map((item) =>
        '<div class="quota-row"><div class="quota-line"><strong>' + esc(item.label) + '</strong><b>' + esc(quotaRemainingText(item)) + '</b></div><span>' + esc(item.resetLabel || item.detail || '--') + '</span><div class="bar"><i style="width:' + Math.max(4, Math.min(100, Number(item.pct) || 0)) + '%"></i></div></div>'
      ).join('');
    }

    function renderRankFacts(facts) {
      const fallback = [
        { label: '当前排名', valueLabel: '#--', detail: '等待排行榜匹配' },
        { label: '距上一名', valueLabel: '--', detail: '等待榜单数据' },
        { label: '上报接收', valueLabel: '--', detail: '等待上传' }
      ];
      const items = facts && Array.isArray(facts.items) && facts.items.length ? facts.items : fallback;
      $('#rankFacts').innerHTML = items.slice(0, 3).map((item) =>
        '<section class="fact"><span>' + esc(item.label || '--') + '</span><strong>' + esc(item.valueLabel || '--') + '</strong><em>' + esc(item.detail || '') + '</em></section>'
      ).join('');
    }

    function renderTools(tools) {
      const rows = Array.isArray(tools) ? tools : [];
      if (!rows.length) {
        $('#toolList').innerHTML = '<div class="empty">未读取到 agent 使用量</div>';
        return;
      }
      $('#toolList').innerHTML = rows.map((tool) =>
        '<div class="tool" title="' + esc(tool.detail || '') + '"><strong>' + esc(tool.label) + '</strong><div class="bar"><i style="width:' + Math.max(4, Math.min(100, Number(tool.pct) || 0)) + '%"></i></div><span>' + esc(tool.valueLabel || '--') + '</span></div>'
      ).join('');
    }

    function renderBars(period) {
      const bars = Array.isArray(period && period.bars) ? period.bars : [];
      if (!bars.length) return '<div class="empty">暂无数据</div>';
      return '<div class="trend-bars">' + bars.map((bar) =>
        '<i title="' + esc((bar.label || '') + ' · ' + (bar.valueLabel || '0')) + '" style="height:' + Math.max(4, Math.min(100, Number(bar.pct) || 0)) + '%"></i>'
      ).join('') + '</div>';
    }

    function renderTrend(trends) {
      const glm = trends && trends.glm ? trends.glm : {};
      const periods = Array.isArray(glm.periods) && glm.periods.length
        ? glm.periods
        : [glm.history1d, glm.history7d, glm.history30d].filter(Boolean);
      if (!periods.length) {
        $('#usageTrend').innerHTML = '<div class="empty">未读取到 GLM 消耗趋势</div>';
        return;
      }
      $('#usageTrend').innerHTML = periods.slice(0, 3).map((period) =>
        '<div class="trend-card"><strong><span>' + esc(period.label || '--') + '</span><span class="trend-total">' + esc(period.totalLabel || '--') + '</span></strong>' + renderBars(period) + '</div>'
      ).join('');
    }

    function setLoading(isLoading) {
      $('#uploadButton').disabled = isLoading;
      $('#uploadButton').style.opacity = isLoading ? '.72' : '1';
      $('#uploadLabel').textContent = isLoading ? '上报中...' : '立即上报';
    }

    function render(data) {
      if (!data || !data.ok) return;
      const account = data.account && data.account.connected ? 'scys ' + data.account.accountId : '未绑定 scys';
      const daemon = data.service && data.service.running ? 'daemon running' : 'service unknown';
      const sync = data.sync && data.sync.label ? data.sync.label : data.source || 'waiting';
      $('#totalValue').textContent = data.totalLabel || '--';
      $('#rankValue').textContent = data.rankLabel || '#--';
      $('#serviceText').textContent = account + ' · ' + (data.date || '--') + ' · ' + sync + ' · ' + daemon;
      $('#serviceText').title = data.sync && data.sync.detail ? data.sync.detail : '';
      renderRankFacts(data.rankFacts);
      renderQuota(data.quotaFeeds);
      renderTools(data.tools);
      renderTrend(data.usageTrends);
      icons();
    }

    async function load() {
      try {
        const response = await fetch(API + '/summary');
        render(await response.json());
      } catch {
        $('#serviceText').textContent = 'Live API unavailable';
      }
    }

    $('#uploadButton').onclick = async () => {
      setLoading(true);
      try {
        await fetch(API + '/upload', { method: 'POST' });
        await load();
      } finally {
        setLoading(false);
      }
    };

    $('#reloadButton').onclick = load;
    $('#leaderboardButton').onclick = async () => {
      try {
        await fetch(API + '/open-leaderboard', { method: 'POST' });
      } catch {}
    };
    $('#logButton').onclick = async () => {
      try {
        await fetch(API + '/open-logs', { method: 'POST' });
      } catch {}
    };

    icons();
    load();
    setInterval(load, 300000);
  </script>
</body>
</html>
